  <title>Creemos juntos una tarjeta · Primera Comunión 5° Grado B</title>

  <!-- Vista previa al compartir (WhatsApp, Instagram, Facebook).
       Esta es la home del creador de tarjetas, no una invitación: el preview

       desde /nene y /nena, que tienen su propio preview. -->

  <meta property="og:site_name" content="Instituto Nuestra Señora de Fátima · 5° Grado B" />
  <meta property="og:title" content="✨ Creemos juntos una tarjeta de Primera Comunión" />
  <meta property="og:description" content="Armá tu invitación en un minuto: elegí nene o nena, poné tu nombre y tu mensaje, y compartila por WhatsApp. Viernes 25 de septiembre de 2026 · 19:00 hs · Parroquia Nuestra Señora de Fátima y San Pío V." />
  <meta property="og:image" content="https://primeracomunion-eta.vercel.app/church.jpg" />
  <meta property="og:image:alt" content="Parroquia Nuestra Señora de Fátima y San Pío V" />
  <meta property="og:url" content="https://primeracomunion-eta.vercel.app/" />
  <meta property="og:locale" content="es_AR" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="✨ Creemos juntos una tarjeta de Primera Comunión" />

       y la tarjeta que se descarga sale con la tipografia por defecto. -->
  <link
    rel="stylesheet"
    crossorigin="anonymous"
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Nunito:wght@400;600;700;800&display=swap"
  />
